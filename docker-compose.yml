version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parcelstats-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://parcelstats:${DB_PASSWORD:-parcelstats}@postgres:5432/parcelstats
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - parcelstats

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: parcelstats-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://parcelstats:${DB_PASSWORD:-parcelstats}@postgres:5432/parcelstats
      - REDIS_URL=redis://redis:6379
      - SCRAPE_HEADLESS=true
      - MODEL_RETRAIN_SCHEDULE=${MODEL_RETRAIN_SCHEDULE:-0 3 * * 0}
      - USPS_WEB_TOOLS_USER_ID=${USPS_WEB_TOOLS_USER_ID:-}
    volumes:
      - ml-models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - parcelstats

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: parcelstats-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=parcelstats
      - POSTGRES_USER=parcelstats
      - POSTGRES_PASSWORD=${DB_PASSWORD:-parcelstats}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed/02-carriers.sql:/docker-entrypoint-initdb.d/02-carriers.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelstats"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - parcelstats

  redis:
    image: redis:7-alpine
    container_name: parcelstats-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - parcelstats

volumes:
  postgres-data:
  redis-data:
  ml-models:

networks:
  parcelstats:
    driver: bridge
